[package]
name = "hp-plugin-host"
version.workspace = true
edition.workspace = true

[dependencies]
hp-core = { path = "../hp-core" }
hp-store = { path = "../hp-store" }
hp-plugin-signing = { path = "../hp-plugin-signing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
