[package]
name = "hp-book"
version.workspace = true
edition.workspace = true

# 电子书元数据与封面解析（EPUB = ZIP + OPF，txt/md 无元数据）。
#
# **不引入 `zip` crate**（D20 依赖本地化）：EPUB 只需要"读中央目录 + 取若干条目 + inflate"，
# 这点子集由 `src/zip.rs` 自实现（约 200 行），解压走已在依赖树里的 `flate2`
# （纯 Rust `miniz_oxide` 后端，无 C 依赖）。引入一个完整 ZIP 实现会为这点用途
# 附带写/加密/zip64/多卷等一大片用不到的面。
[dependencies]
hp-core = { path = "../hp-core" }
flate2 = "1"
# 纯文本（txt/md）的编码判定与解码：实测语料 14 本里 8 本 GBK、6 本 UTF-8 且
# **无一带 BOM**，必须真判编码（见 src/text.rs 的模块文档）。
# - `encoding_rs`：WHATWG 编码标准的实现（Apache-2.0/MIT），UTF-8/UTF-16/GBK 等；
# - `chardetng`：Firefox 用的统计式编码探测器（Apache-2.0/MIT）。
encoding_rs = "0.8"
chardetng = "0.1"

[dev-dependencies]
tempfile = "3"
