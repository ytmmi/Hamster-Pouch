[package]
name = "hp-media"
version.workspace = true
edition.workspace = true

# `libheif`（默认开）：HEIC/HEIF/AVIF **进程内解码**（libde265/aom），注册进
# `image` crate 的 hooks 后 `image::open` 直接可解。代价：libheif-sys 在 Windows 上
# 要求 **vcpkg 安装的 libheif**（`VCPKG_ROOT`，用户 2026-10-06 裁定安装，D20 例外）；
# 无该环境的构建可 `--no-default-features` 关闭，退到捆绑 ffmpeg 兜底。
#
# `libwebp`（默认开，D91）：图片缩略图的 **WebP 编码走进程内**（`libwebp-sys`，MIT，
# C 源码**随 crate vendored**、经 `cc` 静态编译，离线可构建）。与 ffmpeg 内嵌的 libwebp
# **同源同版本**，实测输出**逐字节相同**（145/145 组），但省掉每张一次的进程开销
# （实测 58.7–71.4 ms/张 → 28.6 ms/张）。关掉后自动退回 ffmpeg 子进程编码（结果不变），
# 再失败则退 JPEG——三级降级见 `thumbnail` 模块文档。
[features]
default = ["libheif", "libwebp"]
libheif = ["dep:libheif-rs"]
libwebp = ["dep:libwebp-sys"]

[dependencies]
hp-core = { path = "../hp-core" }
serde_json = "1"
# 注意：不启用 `image` 的 `avif-native`（dav1d）——dav1d-sys 需要系统 dav1d（pkg-config）或
# git+meson+ninja 内部构建，违反 D20「依赖与构建链本地化」；AVIF/HEIC 解码经 `libheif`
# 特性进程内完成（libde265/aom），捆绑 ffmpeg 仍是兜底与全分辨率预览的编码路径。
image = "0.25"
kamadak-exif = "0.5"
libheif-rs = { version = "3", features = ["image"], optional = true }
# 进程内 WebP 编码（D91）。MIT；`vendor/` 内含 libwebp C 源码，构建期由 `cc` 编译，
# 不依赖系统库、不联网（D20）。默认特性 `parallel` 让 `cc` 并行编译这 176 个 .c。
libwebp-sys = { version = "0.14", optional = true }

# 仅 Windows：mpv 的 IPC 命名管道**只有一个句柄**可用，且**同步句柄上的阻塞读会挡住写**
# （实测：第二次 open 直接 ERROR_PIPE_BUSY；同句柄读线程阻塞时写不出去）。
# 因此读取必须先 `PeekNamedPipe` 探明可读字节数、只读已就绪的部分，绝不阻塞。
# 版本与 tauri 2.11 / src-tauri 使用的 windows 0.61 对齐。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Pipes",
] }
