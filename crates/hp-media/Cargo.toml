[package]
name = "hp-media"
version.workspace = true
edition.workspace = true

[dependencies]
hp-core = { path = "../hp-core" }
serde_json = "1"
# 注意：不启用 `avif-native`（dav1d）——dav1d-sys 需要系统 dav1d（pkg-config）或
# git+meson+ninja 内部构建，违反 D20「依赖与构建链本地化」；AVIF/HEIC 解码统一走
# 捆绑 ffmpeg 的有界兜底（`src/decode.rs`，捆绑构建自带 libdav1d，asm 优化）。
image = "0.25"
kamadak-exif = "0.5"

# 仅 Windows：mpv 的 IPC 命名管道**只有一个句柄**可用，且**同步句柄上的阻塞读会挡住写**
# （实测：第二次 open 直接 ERROR_PIPE_BUSY；同句柄读线程阻塞时写不出去）。
# 因此读取必须先 `PeekNamedPipe` 探明可读字节数、只读已就绪的部分，绝不阻塞。
# 版本与 tauri 2.11 / src-tauri 使用的 windows 0.61 对齐。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Pipes",
] }
