[package]
name = "hp-store"
version.workspace = true
edition.workspace = true

[dependencies]
hp-core = { path = "../hp-core" }
hp-db = { path = "../hp-db" }
# 仓库库的表结构、迁移清单与领域仓储（D186），这里只再导出
hp-repo = { path = "../hp-repo" }
# 全局配置库（仓库注册表/设置/面板布局/插件注册表）自 D187 起独立成 crate，这里只再导出
hp-global = { path = "../hp-global" }
# bundled：SQLite 源码编译进 crate，不依赖系统 SQLite（D20 本地化）
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# 测试直接造 uuid 主键（lib 侧已改用 hp-db::uuid）
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
