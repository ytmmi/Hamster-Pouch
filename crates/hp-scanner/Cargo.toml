[package]
name = "hp-scanner"
version.workspace = true
edition.workspace = true

[dependencies]
hp-core = { path = "../hp-core" }
hp-hash = { path = "../hp-hash" }
hp-store = { path = "../hp-store" }
hp-media = { path = "../hp-media" }
walkdir = "2"
notify = "6"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
image = "0.25"
# 测试要解析 `color_refs.color_json`（形状是跨端契约：`version` / `colors` / `locked`）。
serde_json = "1"
