[package]
name = "hamster-pouch-desktop"
version = "0.1.0"
edition = "2021"
description = "仓鼠颊桌面应用壳（Tauri 桥接层）"

# 独立于根 workspace（Tauri 应用自带构建配置，避免与库 workspace 特性合并）
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# 原生系统对话框：「添加媒体源」改为**选取文件夹**，不再手工输入路径。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
hp-core = { path = "../../../crates/hp-core" }
hp-store = { path = "../../../crates/hp-store" }
# 跨层 DTO：命令返回值/事件载荷的**单一事实来源**（docs/spec/shared-types.md），
# 前端 packages/shared-types 由同一批类型生成，桥接层不得另起同形结构体。
hp-dto = { path = "../../../crates/hp-dto" }
hp-scanner = { path = "../../../crates/hp-scanner" }
hp-media = { path = "../../../crates/hp-media" }
hp-album = { path = "../../../crates/hp-album" }
hp-fsops = { path = "../../../crates/hp-fsops" }
hp-plugin-host = { path = "../../../crates/hp-plugin-host" }
hp-ai = { path = "../../../crates/hp-ai" }
trash = "5.2.8"

# 仅 Windows：libmpv 面板级嵌入所需的 Win32 原生子窗口宿主（D14）。
# 版本与 tauri 2.11 使用的 windows 0.61 对齐，保证 HWND 类型兼容。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
] }
